<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NCSE 刷题系统</title>

    <!-- 网站图标：多尺寸 / 多格式声明
         顺序说明：
         1. rel="icon" href="/favicon.ico"          —— 传统格式，兼容 IE11 / 旧 Edge
         2. type="image/png" sizes="32x32"          —— 主流浏览器（Chrome/Edge/Firefox）首选
         3. type="image/png" sizes="16x16"          —— 标签页小图标
         图标资源由 scripts/generate_favicons.py 生成，请勿手工改 public/ 下的图标文件。 -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA / Android 站点图标与主题色 -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1D4ED8" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
