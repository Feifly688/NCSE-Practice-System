# /etc/nginx/sites-available/ncse-practice
# 部署后创建软链接: sudo ln -s /etc/nginx/sites-available/ncse-practice /etc/nginx/sites-enabled/
# 然后: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;  # 改成你的域名或 IP，例如 exam.local 或 192.168.1.100

    # 请求体大小限制（与后端一致）
    client_max_body_size 2m;

    # API 请求代理到 Node.js 后端
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 生成可能很慢，超时设长
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
    }

    # 非 API 请求由 Node.js 托管的前端处理（SPA fallback）
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:4000;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
