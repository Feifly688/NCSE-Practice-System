services:
  backend:
    image: node:20-alpine
    container_name: ncse-backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - frontend_dist:/app/frontend/dist
    command: sh -c "npm install --production && node src/server.js"
    environment:
      - NODE_ENV=production
      - APP_PORT=4000
      - MYSQL_HOST=1Panel-mysql-iXXa
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=ncse-practice-system
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY=${API_KEY:-}
      - BASE_URL=${BASE_URL:-https://api.deepseek.com/v1}
      - MODEL=${MODEL:-deepseek-chat}
    networks:
      - 1panel-network
    ports:
      - "127.0.0.1:4000:4000"
    restart: on-failure:5
    labels:
      createdBy: "Apps"

  frontend-builder:
    image: node:20-alpine
    container_name: ncse-frontend-builder
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_dist:/app/dist
    command: sh -c "npm install && npm run build"
    environment:
      - VITE_API_BASE_URL=/api
    networks:
      - 1panel-network

volumes:
  frontend_dist:

networks:
  1panel-network:
    external: true
